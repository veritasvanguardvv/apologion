# Builds the iOS app and uploads it to TestFlight.
#
# Runs on a GitHub-hosted Mac (macos-26, Xcode 26: App Store Connect requires the
# iOS 26 SDK since April 2026). Godot exports the Xcode project, xcodebuild
# archives and signs it, and altool uploads the .ipa with an App Store Connect API key.
#
# Repo secrets it needs (see TESTFLIGHT.md; tools/ios_ci/asc_setup.py creates the signing ones):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8          App Store Connect API key (.p8 text)
#   IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD     Apple Distribution certificate + private key
#   IOS_PROFILE_BASE64                             App Store provisioning profile for the bundle id
#   IOS_ADHOC_PROFILE_BASE64                       Ad Hoc profile (only for distribution=ad-hoc;
#                                                  `asc_setup.py adhoc` creates it, see IOS_BUILD.md)
#
# distribution=ad-hoc builds an .ipa signed for the registered test iPhones only and
# attaches it to the run as an artifact instead of uploading to TestFlight (no review).
#
# Trigger: manual only for now (Actions tab > "iOS TestFlight" > Run workflow, or
# `gh workflow run ios-testflight.yml`). macOS minutes are expensive on private repos,
# so it does not run on every push. To build automatically, uncomment the push block:
# it only builds commits whose message contains [testflight].

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "app-store = upload to TestFlight; ad-hoc = .ipa artifact for registered devices"
        type: choice
        options: [app-store, ad-hoc]
        default: app-store
      marketing_version:
        description: "Version shown in TestFlight (CFBundleShortVersionString). Blank = the export preset's."
        required: false
        default: ""
  # push:
  #   branches: [main]

concurrency:
  group: ios-testflight-${{ inputs.distribution || 'app-store' }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  PRESET: "iOS"
  APP_NAME: "Apologion"
  BUNDLE_ID: "com.veritasvanguard.apologion"
  DISTRIBUTION: ${{ inputs.distribution || 'app-store' }}

jobs:
  testflight:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          ADHOC_PROFILE: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          missing=""
          if [ "$DISTRIBUTION" = "ad-hoc" ]; then PROFILE="$ADHOC_PROFILE"; fi
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$P12" ] || missing="$missing IOS_DIST_P12_BASE64"
          [ -n "$P12_PW" ] || missing="$missing IOS_DIST_P12_PASSWORD"
          if [ -z "$PROFILE" ]; then
            if [ "$DISTRIBUTION" = "ad-hoc" ]; then missing="$missing IOS_ADHOC_PROFILE_BASE64"
            else missing="$missing IOS_PROFILE_BASE64"; fi
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing (see TESTFLIGHT.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Cache Godot + iOS export template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-ci
          key: godot-${{ env.GODOT_VERSION }}-macos-ios-v1

      - name: Download Godot + iOS export template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-ci/tpl && cd ~/godot-ci
          curl -fsSL --retry 3 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip && rm godot.zip
          curl -fsSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # Only the iOS template is needed (keeps the cache small).
          unzip -q -j templates.tpz templates/ios.zip templates/version.txt -d tpl && rm templates.tpz
          ls -la ~/godot-ci ~/godot-ci/tpl

      - name: Install iOS export template
        run: |
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp ~/godot-ci/tpl/* "$dest/"
          echo "GODOT=$HOME/godot-ci/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          "$GODOT" --headless --path . --import || true
          test -d .godot/imported

      - name: Fix GDExtension framework install names
        # dyld refuses relative install names in signed iOS apps ("relative path not
        # allowed in hardened program") and the app dies at launch. The upstream
        # godot-whisper iOS framework shipped one, so force @rpath before exporting.
        run: |
          set -euo pipefail
          for fw in addons/*/bin/*.ios.*.framework; do
            [ -d "$fw" ] || continue
            bin="$fw/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$fw/Info.plist")"
            install_name_tool -id "@rpath/$(basename "$fw")/$(basename "$bin")" "$bin"
            echo "$bin -> $(otool -D "$bin" | tail -1)"
          done

      - name: Export Xcode project
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "$PRESET" "build/ios/${APP_NAME}.xcodeproj"
          test -f "build/ios/${APP_NAME}.xcodeproj/project.pbxproj"
          test -f "build/ios/${APP_NAME}.pck"
          /usr/libexec/PlistBuddy -c 'Print' "build/ios/${APP_NAME}/${APP_NAME}-Info.plist" | head -60

      - name: Install signing certificate and profile
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          ADHOC_PROFILE: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$DISTRIBUTION" = "ad-hoc" ]; then PROFILE="$ADHOC_PROFILE"; fi
          KC="$RUNNER_TEMP/ci.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk '/Distribution/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { security find-identity -v -p codesigning "$KC"; echo "::error::No distribution identity in the certificate"; exit 1; }

          PP="$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE" | base64 --decode > "$PP"
          security cms -D -i "$PP" > "$RUNNER_TEMP/profile.plist"
          PP_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          PP_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$PP" "$d/$PP_UUID.mobileprovision"
          done
          {
            echo "KC=$KC"; echo "IDENTITY=$IDENTITY"; echo "PP_UUID=$PP_UUID"
            echo "PP_NAME=$PP_NAME"; echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Team $TEAM_ID, profile '$PP_NAME' ($PP_UUID)"

      - name: Archive
        env:
          MARKETING_VERSION_INPUT: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}.${{ github.run_attempt }}"
          extra=()
          [ -n "${MARKETING_VERSION_INPUT:-}" ] && extra+=("MARKETING_VERSION=$MARKETING_VERSION_INPUT")
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          set +e
          xcodebuild archive \
            -project "build/ios/${APP_NAME}.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${APP_NAME}.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PP_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            ${extra[@]+"${extra[@]}"} > "$RUNNER_TEMP/archive.log" 2>&1
          rc=$?
          set -e
          grep -E '^\*\* |error:' "$RUNNER_TEMP/archive.log" | head -40 || true
          if [ "$rc" -ne 0 ]; then tail -100 "$RUNNER_TEMP/archive.log"; exit "$rc"; fi

      - name: Check app launches its frameworks by @rpath
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app"
          otool -L "$APP/${APP_NAME}" | tee "$RUNNER_TEMP/otool.txt"
          if grep -vE '^\s*(/|@rpath/|@executable_path/|@loader_path/)' "$RUNNER_TEMP/otool.txt" | grep -v ':$' | grep -q .; then
            echo "::error::The app links a library by a relative path; it would crash at launch on iOS"; exit 1
          fi

      - name: Export .ipa
        run: |
          set -euo pipefail
          if [ "$DISTRIBUTION" = "ad-hoc" ]; then
            METHOD="release-testing"; SYMBOLS="<false/>"
          else
            METHOD="app-store-connect"; SYMBOLS="<true/>"
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${METHOD}</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${IDENTITY}</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PP_NAME}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key>${SYMBOLS}
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${APP_NAME}.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Keep ad-hoc .ipa
        if: env.DISTRIBUTION == 'ad-hoc'
        uses: actions/upload-artifact@v4
        with:
          name: Apologion-adhoc-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Ad-hoc summary
        if: env.DISTRIBUTION == 'ad-hoc'
        run: |
          echo "### Ad-hoc build ${BUILD_NUMBER} (not uploaded to TestFlight)" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the Apologion-adhoc artifact; it installs only on devices in profile '${PP_NAME}'." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        if: env.DISTRIBUTION != 'ad-hoc'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA="$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          echo "### Uploaded build ${BUILD_NUMBER} to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in the TestFlight app after Apple finishes processing (usually 5-30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Clean up keychain and keys
        if: always()
        run: |
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true
          rm -rf ~/.appstoreconnect/private_keys "$HOME/Library/MobileDevice/Provisioning Profiles" || true
